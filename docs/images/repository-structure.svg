<!-- right panel -->
<rect x="1090" y="175" width="652" height="1070" rx="22" fill="#fff" stroke="#D6E2ED" stroke-width="2"/>
<text x="1125" y="222" class="section">模块分工与规模</text>
<text x="1125" y="250" class="small">HOW THE REPOSITORY IS ORGANIZED</text>

<rect x="1120" y="278" width="590" height="145" rx="16" fill="#E8F1FF" stroke="#C8DCF2"/>
<rect x="1138" y="296" width="8" height="109" rx="4" fill="#2F75C8"/>
<text x="1165" y="319" class="cardTitle" fill="#2F75C8">01 · DESKTOP / desktop/</text>
<text x="1165" y="352" class="body">Electron 43 + React 19 · 主进程 / Preload / Renderer</text>
<text x="1165" y="380" class="body">会话与工作区 · staging · 画布 · 电气工作台 · 表格</text>
<text x="1165" y="405" class="small">厂商资源、Windows UIA MCP、版本与能力路由</text>

<rect x="1120" y="442" width="590" height="190" rx="16" fill="#F0ECFF" stroke="#D7CEF2"/>
<rect x="1138" y="460" width="8" height="154" rx="4" fill="#7959C7"/>
<text x="1165" y="483" class="cardTitle" fill="#7959C7">02 · RUST ENGINE / engine/</text>
<text x="1165" y="516" class="body">9 个 Crates：engine / cli / runtime / tools / api</text>
<text x="1165" y="544" class="body">commands / plugins / telemetry / win-proc-guard</text>
<text x="1165" y="578" class="body">32 份工具契约 · 4 ReadOnly / 13 WorkspaceWrite</text>
<text x="1165" y="606" class="body">15 DangerFullAccess · 语料资产不随公开源码树保证</text>

<rect x="1120" y="651" width="590" height="160" rx="16" fill="#E7F6EF" stroke="#CBE6D8"/>
<rect x="1138" y="669" width="8" height="124" rx="4" fill="#218764"/>
<text x="1165" y="692" class="cardTitle" fill="#218764">03 · MODEL GATEWAY / model-gateway/</text>
<text x="1165" y="725" class="body">model-gateway.cjs · provider-discovery.cjs</text>
<text x="1165" y="753" class="body">provider-protocol.cjs · model-catalog.json</text>
<text x="1165" y="781" class="small">本地回环代理 · 模型探测 · OpenAI / Anthropic 转换</text>

<rect x="1120" y="830" width="590" height="160" rx="16" fill="#FFF2E2" stroke="#F0D9BB"/>
<rect x="1138" y="848" width="8" height="124" rx="4" fill="#C97826"/>
<text x="1165" y="871" class="cardTitle" fill="#C97826">04 · SPECS &amp; KNOWLEDGE / engine/spec/</text>
<text x="1165" y="904" class="body">工具契约：名称 / 参数 Schema / 权限 / Hash</text>
<text x="1165" y="932" class="body">知识语料：生成器案例、工程经验、技能、版本指令</text>
<text x="1165" y="960" class="small">知识库与工具契约是不同资产，不应混为一类</text>

<rect x="1120" y="1009" width="590" height="205" rx="16" fill="#F3F6F9" stroke="#D7E1E9"/>
<text x="1145" y="1046" font-size="19" font-weight="700" fill="#18324B">构建与发行：源码 ≠ 完整安装包</text>
<text x="1145" y="1081" class="body">electron-builder.yml 将 resources/engine、routes、</text>
<text x="1145" y="1109" class="body">computer-use、inoproshop、autoshop、weinview 等</text>
<text x="1145" y="1137" class="body">资源复制进 Windows x64 Portable 发行目录。</text>
<text x="1145" y="1175" class="small">执行器、Openness 桥与部分 Python / PLCSIM 二进制</text>
<text x="1145" y="1199" class="small">不全部纳入源码仓库；打包前须准备对应组件。</text>

<text x="60" y="1287" font-size="15" fill="#5D7488">图示依据：main 分支 6f1f721 · desktop/package.json 2.1.20 · engine/Cargo.toml workspace · engine/spec/tool_contracts/TOOLS.md</text>
</svg>