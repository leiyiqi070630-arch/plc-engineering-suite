<text x="151" y="65" class="h1">PLC Engineering Suite</text>
<text x="153" y="104" class="sub">仓库结构图 · REPOSITORY MAP · SOURCE-ALIGNED 2.1.20</text>
<rect x="1452" y="48" width="286" height="42" rx="21" fill="#244967"/>
<text x="1595" y="75" font-size="16" font-weight="700" fill="#D9EBFA" text-anchor="middle">MAIN BRANCH · 6f1f721</text>

<!-- tree panel -->
<rect x="58" y="175" width="1000" height="1070" rx="22" fill="#111E2D" stroke="#2B4359" stroke-width="2"/>
<rect x="85" y="198" width="160" height="31" rx="15" fill="#263F55"/>
<text x="165" y="220" font-size="15" font-weight="700" fill="#B9D9F5" text-anchor="middle">SOURCE TREE</text>
<text x="90" y="270" font-size="27" font-weight="700" fill="#fff">plc-engineering-suite/</text>
<g class="tree">
<text x="105" y="322">├── desktop/</text>
<text x="145" y="356">├── src/main/</text><text x="690" y="356" class="comment">Electron 主进程、IPC、会话、EngineBridge、网关</text>
<text x="145" y="390">├── src/preload/</text><text x="690" y="390" class="comment">contextBridge：受控 API 暴露</text>
<text x="145" y="424">├── src/renderer/</text><text x="690" y="424" class="comment">React 19 界面与构建资源</text>
<text x="145" y="458">├── resources/routes/</text><text x="690" y="458" class="comment">版本矩阵、能力路由、厂商映射</text>
<text x="145" y="492">├── resources/engine/</text><text x="690" y="492" class="comment">引擎资源 / TIA 知识库；预构建组件按需放入</text>
<text x="145" y="526">├── resources/{inoproshop,autoshop,weinview}/</text><text x="690" y="526" class="comment">各品牌桥接、脚本、工程资源</text>
<text x="145" y="560">├── resources/computer-use/</text><text x="690" y="560" class="comment">随桌面端打包的 Windows UIA MCP 组件</text>
<text x="145" y="594">├── tools/windows-computer-use/</text><text x="690" y="594" class="comment">UI 自动化组件源码、文档与脚本</text>
<text x="145" y="628">├── rust/ · scripts/ · docs/</text><text x="690" y="628" class="comment">开发态根目录探测占位、构建脚本、桌面文档</text>
<text x="145" y="662">└── electron-builder.yml</text><text x="690" y="662" class="comment">Windows x64 Portable 打包与 extraResources</text>

<text x="105" y="716">├── engine/</text>
<text x="145" y="750">├── crates/</text><text x="690" y="750" class="comment">Rust workspace · 9 个 crate</text>
<text x="185" y="784">├── plceng-engine/ · plceng-cli/</text><text x="690" y="784" class="comment">程序入口、CLI、REPL、Bridge</text>
<text x="185" y="818">├── runtime/ · api/</text><text x="690" y="818" class="comment">会话运行时、MCP、模型 API 客户端</text>
<text x="185" y="852">├── tools/</text><text x="690" y="852" class="comment">PLC 工具集：声明、校验、执行、路由</text>
<text x="185" y="886">├── commands/ · plugins/</text><text x="690" y="886" class="comment">Slash 命令与插件装载</text>
<text x="185" y="920">└── telemetry/ · win-proc-guard/</text><text x="690" y="920" class="comment">事件遥测与 Windows 子进程守护</text>
<text x="145" y="954">├── spec/tool_contracts/</text><text x="690" y="954" class="comment">32 份已注册工具契约与 JSON Schema</text>
<text x="145" y="988">├── spec/corpus/</text><text x="690" y="988" class="comment">当前公开 main 未跟踪；以发行包 / 本地资源清单核验</text>
<text x="145" y="1022">└── docs/</text><text x="690" y="1022" class="comment">引擎设计、模块划分、工具目录与协议说明</text>

<text x="105" y="1076">├── model-gateway/</text>
<text x="145" y="1110">├── model-gateway.cjs · provider-*.cjs</text><text x="690" y="1110" class="comment">本地 HTTP 网关、模型发现、协议转换</text>
<text x="145" y="1144">└── model-catalog.json · seed.example.json · inject-*.py</text><text x="690" y="1144" class="comment">模型能力表、配置样例、构建注入脚本</text>

<text x="105" y="1198">├── docs/images/</text><text x="690" y="1198" class="comment">项目架构图与仓库结构图</text>
<text x="105" y="1232">└── README.md · LICENSE</text>
</g>
